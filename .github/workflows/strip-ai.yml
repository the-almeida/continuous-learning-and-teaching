name: strip-ai

on:
  pull_request:
    branches: [main]
    paths:
      - "strip-ai/**"
      - ".claude-plugin/**"
      - ".github/workflows/strip-ai.yml"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "lts/jod"
      - run: node --test strip-ai/test/rules.test.mjs strip-ai/test/cli.test.mjs strip-ai/test/documents.test.mjs strip-ai/test/hardening.test.mjs
